<!DOCTYPE html>
<html>
<head>
    <title>Rainfall Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .main { height: calc(100vh - 48px); align-items: stretch; }

        /* ── LEFT PANEL ── */
        .rm-left {
            width: 32%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        .rm-left-header {
            padding: 16px;
            border-bottom: 1px solid #3d4e63;
            flex-shrink: 0;
        }

        .source-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: #4a5568 #1a202c;
        }

        .source-list::-webkit-scrollbar { width: 6px; }
        .source-list::-webkit-scrollbar-track { background: #1a202c; }
        .source-list::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 3px; }

        .source-card {
            background: #1a202c;
            border: 1px solid #3d4e63;
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: 0.15s;
            cursor: pointer;
        }

        .source-card:hover { border-color: #627aad; background: #1a2535; }
        .source-card.active { border-color: #627aad; background: #1a2535; }
        .source-card.selected-preview { border-color: #68d391; background: #1a2a1a; }

        .source-card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .source-name { font-size: 13px; font-weight: bold; color: #a0aec0; }

        .source-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .badge-builtin  { background: #2b4a7a; color: #90cdf4; }
        .badge-uploaded { background: #2a4a2a; color: #68d391; }
        .badge-active   { background: #627aad; color: #c0cfe8; }

        .source-card-actions {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .btn-set-active {
            flex: 1;
            padding: 6px;
            background: #627aad;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn-set-active:hover { background: #4a6db5; }
        .btn-set-active:disabled { background: #2d3748; color: #4a5568; cursor: default; }

        .btn-delete {
            padding: 6px 10px;
            background: #4a1a1a;
            color: #fc8181;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
        }

        .btn-delete:hover { background: #6b2020; }

        /* ── RIGHT PANEL ── */
        .rm-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            padding: 0;
            gap: 0;
        }

        .rm-right-top {
            padding: 16px 20px;
            border-bottom: 1px solid #2d3748;
            flex-shrink: 0;
        }

        .upload-zone {
            border: 2px dashed #4a5568;
            border-radius: 8px;
            padding: 10px 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #111827;
            margin-bottom: 10px;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: #516286;
            background: #1a2535;
        }

        .upload-zone p { font-size: 13px; color: #718096; margin: 0; }
        .upload-zone strong { color: #a0aec0; }

        .upload-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .upload-controls input[type="text"] {
            flex: 1;
            padding: 9px 12px;
            background: #1a202c;
            color: #c0cfe8;
            border: 1px solid #4a5568;
            border-radius: 6px;
            font-size: 13px;
        }

        .upload-controls input[type="text"]:focus {
            outline: none;
            border-color: #627aad;
        }

        .btn-upload {
            padding: 9px 20px;
            background: #627aad;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-upload:hover { background: #4a6db5; }
        .btn-upload:disabled { background: #2d3748; color: #4a5568; cursor: default; }

        /* ── PREVIEW TABLE ── */
        .preview-area {
            flex: 1;
            overflow: auto;
            padding: 16px 20px;
            scrollbar-width: thin;
            scrollbar-color: #4a5568 #1a202c;
        }

        .preview-area::-webkit-scrollbar { width: 6px; height: 6px; }
        .preview-area::-webkit-scrollbar-track { background: #1a202c; }
        .preview-area::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 3px; }

        .preview-label {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #a0aec0;
            margin-bottom: 10px;
        }

        .preview-table-wrap {
            overflow: auto;
            border-radius: 8px;
            border: 1px solid #2d3748;
            scrollbar-width: thin;
            scrollbar-color: #4a5568 #1a202c;
        }

        .preview-table-wrap::-webkit-scrollbar { height: 6px; }
        .preview-table-wrap::-webkit-scrollbar-track { background: #1a202c; }
        .preview-table-wrap::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 3px; }

        .preview-table { width: 100%; border-collapse: collapse; font-size: 12px; }

        .preview-table th {
            background: #1e2a3a;
            color: #a0aec0;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            padding: 8px 10px;
            text-align: center;
            border: 1px solid #2d3748;
            white-space: nowrap;
        }

        .preview-table td {
            padding: 7px 10px;
            border: 1px solid #1e2a3a;
            text-align: center;
            color: #cbd5e0;
            font-size: 12px;
        }

        .preview-table tr:nth-child(even) td { background: #111827; }
        .preview-table td:first-child { color: #63b3ed; font-weight: bold; }

        .status-msg {
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 6px;
            margin-top: 8px;
        }

        .status-ok    { background: #1a3a1a; color: #68d391; border: 1px solid #2a5a2a; }
        .status-error { background: #3a1a1a; color: #fc8181; border: 1px solid #5a2a2a; }

        #fileInput { display: none; }
    </style>
</head>
<body>

<div class="topbar">
    <button onclick="window.location.href='/open/{{project}}'" class="app-btn">Back</button>
    <button onclick="window.location.href='/storm_simulation'" class="app-btn">Storm Simulation</button>
    <button onclick="printDataset()" class="app-btn">Print Dataset</button>
    <span style="font-size:13px; color:#718096;">Storm Solver — Rainfall Manager</span>
</div>

<div class="main">
    <button type="button" id="togglePanel" class="action-btn"></button>

    <!-- ── LEFT PANEL — SOURCE LIST ── -->
    <div class="left rm-left">
        <div class="rm-left-header">
            <h3 class="panel-label">IDF Data Sources</h3>
            <div style="font-size:11px; color:#718096; margin-top:4px;">
                Click a source to preview its data. Set active to use for Q computation.
            </div>
        </div>
        <div class="source-list" id="sourceList"></div>
    </div>

    <!-- ── RIGHT PANEL — UPLOAD + PREVIEW ── -->
    <div class="right rm-right">

        <div class="rm-right-top">

            <h3 class="panel-label" style="margin-bottom:12px;">Upload IDF Dataset</h3>

            <div class="upload-zone" id="uploadZone"
                 onclick="document.getElementById('fileInput').click()">
                <p><strong>Click to browse</strong> or drag and drop</p>
                <p style="margin-top:6px;">Accepts .xlsx, .csv, .json</p>
                <p id="selectedFileName" style="margin-top:8px; color:#577bc7;"></p>
            </div>

            <input type="file" id="fileInput" accept=".xlsx,.csv,.json">

            <div class="upload-controls">
                <input type="text" id="datasetName"
                       placeholder="Dataset name (e.g. Lagos IDF 2020)">
                <button class="btn-upload" id="uploadBtn"
                        onclick="uploadDataset()" disabled>
                    Upload & Save
                </button>
            </div>

            <div id="statusMsg" style="display:none;"></div>

        </div>

        <!-- CLEAR PREVIEW -->
        <div id="clearPreviewBar" style="display:none; padding: 6px 20px; background:#1a2a1a; border-top: 1px solid #2a5a2a; flex-shrink:0;">
            <button onclick="clearPreview()" style="padding:5px 14px; background:#2a4a2a; color:#68d391; border:1px solid #2a5a2a; border-radius:5px; font-size:11px; font-weight:bold; cursor:pointer;">
                ✕ Clear Preview
            </button>
        </div>

        <!-- PREVIEW -->
        <div class="preview-area">
            <div class="preview-label" id="previewLabel" style="display:none;"></div>
            <div class="preview-table-wrap" id="previewWrap" style="display:none;">
                <table class="preview-table" id="previewTable"></table>
            </div>
        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='rainfall_manager.js') }}"></script>
<script>
document.getElementById("togglePanel").textContent = "⮜";

document.getElementById("togglePanel").onclick = function(){

    document.querySelector(".left").classList.toggle("collapsed");

    this.textContent =
        document.querySelector(".left").classList.contains("collapsed")
        ? "☰"
        : "⮜";

};
</script>

</body>
</html>
